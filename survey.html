<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 手机上用: 禁止双指缩放整页（地图自己处理缩放），贴满刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>实地标注</title>
    <style>
      /* 整页就是一张地图，不要滚动条；背景和地图空白处同色 */
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d7dce3; }
    </style>
  </head>
  <body>
    <!-- 挂载点: src/survey/SurveyApp.vue -->
    <div id="app"></div>
    <script type="module" src="/src/survey/main.js"></script>
  </body>
</html>
